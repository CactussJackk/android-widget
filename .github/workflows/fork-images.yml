name: Fork images

# Publishes this fork's API, web and migrator images as `:widget` and `:widget-<sha>`
# in the owner's GHCR, without the upstream release tags.
on:
  push:
    branches:
      - feature/widget
    paths-ignore:
      - "android/**"
      - ".github/workflows/android-widget.yml"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, migrator]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/openmonetis-${{ matrix.target }}:widget
            ghcr.io/${{ env.OWNER }}/openmonetis-${{ matrix.target }}:widget-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=fork-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.target }}
